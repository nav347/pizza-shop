<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu - Vaporwave Pizza</title><link rel="stylesheet" href="style.css"></head><body>
<div class="sun"></div><nav><a class="brand" href="index.html">&#9728; <span data-shop="name">Slice of Heaven Pizza</span></a><a href="index.html">HOME</a><a href="menu.html" class=on>MENU</a><a href="visit.html">VISIT</a></nav>
<main>
<h1 class="chrome glitch">MENU</h1><p class="sub"><span data-shop="tagline">Hot, fresh, wood-fired pizza</span></p><div id="menu"><div class="win"><h2>Pizzas</h2><div class="body"><div class="item"><div><span class="n">Margherita</span><span class="d">Tomato, mozzarella, basil</span></div><span class="dots"></span><span class="p">&#8377;199</span></div><div class="item"><div><span class="n">Paneer Tikka</span><span class="d">Paneer, onion, capsicum</span></div><span class="dots"></span><span class="p">&#8377;279</span></div></div></div></div>
</main>
<footer>Prices in &#8377;</footer>
<script src="../shop.js"></script><script src="../switcher.js"></script>
<script>
window.addEventListener("load",function(){var m=document.getElementById("menu");if(!m||m.children.length)return;
var d=(window.SHOP&&window.SHOP.menu)||[];
m.innerHTML=d.map(function(c){return '<div class="win"><h2>'+c.category+'</h2><div class="body">'+c.items.map(function(i){return '<div class="item"><div><span class="n">'+i.name+'</span><span class="d">'+(i.desc||"")+'</span></div><span class="dots"></span><span class="p">&#8377;'+i.price+'</span></div>'}).join("")+'</div></div>'}).join("")||m.innerHTML;});
</script></body></html>
