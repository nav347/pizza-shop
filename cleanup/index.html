<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maple Axis: post-drywall cleanup, website designs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}html,body{max-width:100%;overflow-x:hidden}
body{background:#f4f7fb;color:#12202f;font:17px/1.55 Inter,system-ui,sans-serif;padding-bottom:70px}
header{text-align:center;padding:44px 5vw 18px;max-width:820px;margin:0 auto}
h1{font-size:clamp(2rem,7vw,3.4rem);line-height:1.1;font-weight:800;color:#0b3a6e}
header p{margin-top:12px;color:#3d5168}
.logochip{display:inline-block;background:#fff;border:2px solid #d5e0ee;border-radius:16px;padding:8px 18px;margin-bottom:10px}.logochip img{display:block;height:auto;max-width:200px;width:100%}.newb{display:inline-block;background:#f2b233;color:#111;font-size:.7rem;font-weight:800;border-radius:999px;padding:2px 9px;margin-left:8px;vertical-align:middle}
.tag{display:inline-block;margin-top:14px;font-size:.8rem;font-weight:600;background:#e2eefb;color:#0b3a6e;border-radius:999px;padding:4px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;max-width:1100px;margin:24px auto;padding:0 5vw}
.card{display:flex;flex-direction:column;background:#fff;border:2px solid #d5e0ee;border-radius:14px;padding:18px;color:inherit;text-decoration:none;min-height:170px;transition:transform .2s,border-color .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);border-color:#1167c9;box-shadow:0 8px 20px rgba(11,58,110,.12)}
.card:focus-visible{outline:3px solid #1167c9;outline-offset:3px}
.sw{height:10px;border-radius:5px;margin-bottom:12px}
.n{font-size:.8rem;font-weight:800;color:#6b7f95;letter-spacing:.08em}
.card h2{font-size:1.2rem;margin:2px 0 6px}.card p{font-size:.95rem;color:#3d5168;flex:1}
.go{font-weight:600;color:#1167c9;margin-top:12px}
.cw{display:flex;flex-direction:column;min-width:0}.cw[hidden]{display:none}.cw .card{flex:1}
.rt{background:#fff;border:2px solid #d5e0ee;border-top:0;border-radius:0 0 14px 14px;margin:-8px 8px 0;padding:10px 8px 6px;position:relative;z-index:1}
.rt .pr-w{color:#12202f;max-width:100%}.rt .pr-w button{color:#b5c3d3}.rt .pr-w button.on{color:#f5a300}.rt .pr-w button.hf.on{color:#e0245e}.rt .pr-t{flex-basis:100%;margin:2px 0 0 4px;color:#3d5168}
.meta{padding:6px 10px 0;font-size:.85rem;color:#3d5168;margin:0 8px;position:relative;z-index:1;background:#fff;border:2px solid #d5e0ee;border-top:0;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}.meta a{color:#1167c9;font-weight:600}.meta button{background:none;border:0;color:#0b3a6e;font:inherit;font-weight:600;cursor:pointer;padding:4px 0}.meta .np{flex-basis:100%}.meta .np p{margin:4px 0}.meta :focus-visible{outline:3px solid #1167c9;outline-offset:2px}
.tools{max-width:1100px;margin:10px auto 0;padding:0 5vw;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.95rem;color:#3d5168}
.tools select,.tools button{background:#fff;color:#0b3a6e;border:2px solid #d5e0ee;border-radius:10px;padding:8px 10px;font:inherit;font-weight:600;min-height:40px;cursor:pointer}
.tools button[aria-pressed=true]{background:#1167c9;color:#fff;border-color:#1167c9}
.tools :focus-visible{outline:3px solid #1167c9;outline-offset:2px}
.empty{grid-column:1/-1;text-align:center;color:#3d5168}.pnote{max-width:1100px;margin:6px auto 0;padding:0 5vw;font-size:.8rem;color:#3d5168}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><link rel="icon" type="image/png" href="assets/maple-axis-mark.png"></head>
<body>
<header><span class="logochip"><img src="assets/maple-axis-logo.png" alt="Maple Axis logo" width="200" height="88"></span><h1 data-biz="name">Maple Axis</h1><p><span data-biz="tagline"></span><br>Post-drywall cleanup for Toronto and the GTA. One business, many different websites. Pick a vibe.</p><span class="tag">Placeholder brand for a design test</span></header>
<div class="tools"><label>Sort <select id="srt"><option value="n">Version</option><option value="r">Highest rated</option><option value="f">Most favourited</option></select></label><button type="button" id="myf" aria-pressed="false">&#10084; Your favourites</button><button type="button" id="shh" aria-pressed="false">Show hidden</button></div><p class="pnote" id="pnote" aria-live="polite"></p>
<main class="grid" id="grid">
</main>
<script src="business.js"></script><script src="../ratings.js"></script><script src="switcher.js"></script>
<script>
(function(){
  function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML;}
  function cards(L){
    var g=document.getElementById("grid"),o="";
    L.forEach(function(e,i){var n=i+1;n=(n<10?"0":"")+n;
      o+='<a class="card" href="'+esc(e.id)+'/index.html"><div class="sw" style="background:linear-gradient(90deg,'+esc(e.swatch[0])+','+esc(e.swatch[1])+')"></div><span class="n">'+n+(e.tag?' <span class="newb">'+esc(e.tag)+'</span>':'')+'</span><h2>'+esc(e.title)+'</h2><p>'+esc(e.vibe)+'</p><span class="go">Open &rarr;</span></a>';});
    g.innerHTML=o;
  }
  function init(){
  var grid=document.getElementById("grid"),srt=document.getElementById("srt"),myf=document.getElementById("myf"),note=document.getElementById("pnote");
  var items=[],i=0;
  [].slice.call(grid.querySelectorAll("a.card")).forEach(function(a){
    var slug=a.getAttribute("href").split("/")[0],w=document.createElement("div");
    w.className="cw";grid.replaceChild(w,a);w.appendChild(a);
    w.id="card-"+slug;
    var V=window.CleanupVersions,ver=V.byId(slug)||{},ns=V.notes(slug),m=document.createElement("div");m.className="meta";
    if(ver.parent){var pr=V.byId(ver.parent),pa=document.createElement("a");pa.href="#card-"+ver.parent;pa.textContent="branched from "+(pr?pr.title:ver.parent);m.appendChild(pa);}
    var nb=document.createElement("button");nb.type="button";nb.textContent="\uD83D\uDCDD "+ns.length+(ns.length===1?" note":" notes");nb.setAttribute("aria-expanded","false");
    var np=document.createElement("div");np.className="np";np.hidden=true;
    nb.onclick=function(){np.hidden=!np.hidden;nb.setAttribute("aria-expanded",String(!np.hidden));if(!np.hidden)V.renderNotes(np,slug);};
    m.appendChild(nb);m.appendChild(np);w.appendChild(m);
    var r=document.createElement("div");r.className="rt";w.appendChild(r);
    items.push({slug:slug,el:w,box:r,pos:i++});
  });
  var empty=document.createElement("p");empty.className="empty";empty.textContent="No favourites yet: tap the heart on a design.";
  var shh=document.getElementById("shh");function showAll(){return shh.getAttribute("aria-pressed")==="true";}
  function render(){
    var R=window.PizzaRatings,st=R.store,mode=srt.value,only=myf.getAttribute("aria-pressed")==="true";
    items.forEach(function(x){x.apply(showAll());});
    var nz=function(x){return x.folded?1:0;};
    var vis=items.filter(function(x){return !only||st.isFav(x.slug);});
    if(mode==="r")vis.sort(function(a,b){var A=st.stats(a.slug),B=st.stats(b.slug);return nz(a)-nz(b)||B.avg-A.avg||B.count-A.count||a.pos-b.pos;});
    else if(mode==="f")vis.sort(function(a,b){return nz(a)-nz(b)||st.stats(b.slug).favs-st.stats(a.slug).favs||a.pos-b.pos;});
    else vis.sort(function(a,b){return a.pos-b.pos;});
    items.forEach(function(x){x.el.hidden=vis.indexOf(x)<0;});
    vis.forEach(function(x){grid.appendChild(x.el);});
    if(!vis.length)grid.appendChild(empty);else if(empty.parentNode)grid.removeChild(empty);
    note.textContent=st.mode()==="local"?R.note:"";
  }
  function start(){
    var R=window.PizzaRatings;
    items.forEach(function(x){x.box.appendChild(R.makeWidget(x.slug));R.attachFold(x);});
    shh.onclick=function(){shh.setAttribute("aria-pressed",showAll()?"false":"true");render();};
    R.store.subscribe(render);srt.onchange=render;
    myf.onclick=function(){myf.setAttribute("aria-pressed",myf.getAttribute("aria-pressed")==="true"?"false":"true");render();};
    render();
  }
  if(window.PizzaRatings)start();else{var n=0,t=setInterval(function(){if(window.PizzaRatings){clearInterval(t);start();}else if(++n>80)clearInterval(t);},50);}
  }
  window.CleanupVersions.ready(function(L){cards(L);init();});
})();
</script>
</body></html>
